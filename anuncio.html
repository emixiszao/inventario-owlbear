<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item</title>
<link rel="stylesheet" href="shared.css">
<style>
  html, body { margin:0; height:100%; background:transparent; font-family:Georgia,'Times New Roman',serif; color:#eee; overflow:hidden; }
  #ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
        padding:24px 20px 34px; background:radial-gradient(ellipse at center, rgba(22,24,36,.93), rgba(4,5,9,.97)); animation:entra .45s ease; }
  @keyframes entra { from { opacity:0; transform:scale(1.03); } to { opacity:1; transform:none; } }
  #x { position:absolute; top:14px; right:16px; width:36px; height:36px; border:0; border-radius:50%; background:#ffffff1c; color:#fff; font-size:18px; cursor:pointer; }
  #x:hover { background:#ffffff40; }
  #nome { margin:0; text-align:center; font-size:clamp(28px,5.5vw,58px); letter-spacing:.08em; text-transform:uppercase; color:#f3e3c3; text-shadow:0 2px 18px #000; }
  #desc { max-width:720px; width:100%; max-height:30vh; overflow:auto; text-align:justify; hyphens:auto; font-size:clamp(15px,2vw,20px); line-height:1.55; color:#d6d8e4; padding:0 6px; }
  #desc b { color:#fff; }
  #barra { position:absolute; left:0; right:0; bottom:0; height:5px; background:#ffffff14; }
  #prog { display:block; height:100%; width:100%; background:#d9925e; transform-origin:left; }
</style>
</head>
<body>
<div id="ov">
  <button id="x" title="Fechar">✕</button>
  <div id="img"></div>
  <h1 id="nome"></h1>
  <div id="desc"></div>
  <div id="barra"><i id="prog"></i></div>
</div>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";
import { MODAL_ANUNCIO, sanitize, holoHTML, initHolo } from "./shared.js";

const DURACAO = 8000; // tempo na tela, em milissegundos
let dados = {};
try { dados = JSON.parse(new URLSearchParams(location.search).get("d") || "{}"); } catch (e) {}

document.getElementById("nome").textContent = dados.nome || "";
document.getElementById("desc").innerHTML = sanitize(dados.descricao || "");
const imgBox = document.getElementById("img");
if (dados.img && /^https?:\/\//.test(dados.img)) {
  imgBox.innerHTML = holoHTML(dados.img);
  initHolo(imgBox.querySelector(".holo"));
}

let fechado = false;
function fechar() {
  if (fechado) return; fechado = true;
  OBR.modal.close(MODAL_ANUNCIO).catch(() => {});
}
document.getElementById("x").onclick = fechar;
document.getElementById("ov").addEventListener("click", e => {
  if (!e.target.closest(".holo") && !e.target.closest("#desc") && e.target.id !== "nome") fechar();
});

// Contagem regressiva (pausa enquanto a pessoa mexe no item)
const prog = document.getElementById("prog");
let decorrido = 0, ultimo = performance.now(), pausado = false;
imgBox.addEventListener("pointerenter", () => pausado = true);
imgBox.addEventListener("pointerleave", () => pausado = false);
document.getElementById("desc").addEventListener("pointerenter", () => pausado = true);
document.getElementById("desc").addEventListener("pointerleave", () => pausado = false);
(function tick(agora) {
  if (fechado) return;
  if (!pausado) decorrido += agora - ultimo;
  ultimo = agora;
  prog.style.transform = `scaleX(${Math.max(0, 1 - decorrido / DURACAO)})`;
  if (decorrido >= DURACAO) return fechar();
  requestAnimationFrame(tick);
})(performance.now());

OBR.onReady(() => {});
</script>
</body>
</html>
